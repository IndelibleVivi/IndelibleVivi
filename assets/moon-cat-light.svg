  <title id="title">IndelibleVivi · a catnap among the stars</title>
  <desc id="desc">A sleepy line-drawn cat flops over the top of the page, its paws dangling over the edge. Pixel moons and stars hang from knotted threads. IndelibleVivi is lettered in hand-placed pixels, with a tiny fish and pawprints nearby.</desc>
